<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17452d"><title>Panel administratora · Model Państwa</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17231b;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#17452d;color:white;padding:1.3rem max(1rem,calc((100% - 1050px)/2))}main{max-width:1050px;margin:1.2rem auto;padding:0 1rem 3rem}.card{background:white;border:1px solid #dce5de;border-radius:14px;padding:1rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.field{margin:.7rem 0}.field label{display:block;font-weight:650;margin-bottom:.25rem}input,select,textarea{width:100%;padding:.7rem;border:1px solid #cbd8ce;border-radius:8px;font:inherit}textarea{min-height:80px}.btn{border:0;border-radius:8px;background:#1e5c3a;color:white;padding:.65rem .9rem;font-weight:650;cursor:pointer}.btn.secondary{background:#eaf0ec;color:#17231b;border:1px solid #dce5de}.btn.danger{background:#a83232}.btn:disabled{opacity:.5}.report{border:1px solid #dce5de;border-left:4px solid #1e5c3a;border-radius:10px;padding:1rem;margin:.7rem 0}.meta{color:#647268;font-size:.82rem}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}.notice{padding:.7rem;background:#fff4d8;border-left:4px solid #9b7600;border-radius:6px}.hidden{display:none!important}.error{color:#a83232}.ok{color:#1e5c3a}a{color:#1e5c3a}
</style></head><body><header><h1>Panel administratora</h1><p>Model Państwa · moderacja i obsługa zgłoszeń</p></header><main>
<section class="card" id="loginCard"><h2>Logowanie administratora</h2><p class="meta">Użyj konta Supabase przypisanego do roli administratora.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Hasło</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn">Zaloguj</button></form><p id="loginMessage" role="status"></p></section>
<section class="card hidden" id="appCard"><div class="grid"><div><h2>Zgłoszenia</h2><p class="meta" id="sessionInfo"></p></div><div style="text-align:right"><button class="btn secondary" id="refreshBtn">Odśwież</button> <button class="btn secondary" id="logoutBtn">Wyloguj</button></div></div>
<div class="notice">Nowe zgłoszenia trafiają do kolejki „Oczekuje”. Dopiero zatwierdzone są widoczne publicznie. Usunięcie zgłoszenia jest nieodwracalne.</div>
<div class="field"><label for="filter">Filtr moderacji</label><select id="filter"><option value="all">Wszystkie</option><option value="oczekuje">Oczekujące</option><option value="zatwierdzone">Zatwierdzone</option><option value="odrzucone">Odrzucone</option></select></div>
<div id="reports" aria-live="polite"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const SUPABASE_URL='https://ldjrinmohlomzlyeagwd.supabase.co';
const SUPABASE_KEY='sb_publishable_aMRUSYoNLbIriNAxLdu9mQ_KTqqefWR';
const FUNCTION_URL=SUPABASE_URL+'/functions/v1/admin-manage-reports';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let reports=[];
function message(target,text,isError=false){$(target).textContent=text;$(target).className=isError?'error':'ok';}
function date(value){const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('pl-PL');}
async function api(method,body){
 const {data:{session}}=await client.auth.getSession();
 if(!session?.access_token)throw new Error('Sesja wygasła. Zaloguj się ponownie.');
 const response=await fetch(FUNCTION_URL,{method,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(result.error||('Błąd serwera: '+response.status));
 return result;
}
function render(){
 const filter=$('filter').value;
 const rows=reports.filter(r=>filter==='all'||r.moderation_status===filter);
 $('reports').innerHTML=rows.length?rows.map(r=>{
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return '<article class="report"><div class="meta">#'+esc(r.number)+' · '+date(r.created_at)+' · '+esc(r.category)+' · moderacja: <b>'+esc(r.moderation_status)+'</b></div><p><b>'+esc(r.location||'Brak lokalizacji')+'</b></p><p style="white-space:pre-wrap">'+esc(r.description)+'</p>'+
  '<div class="grid"><div class="field"><label>Moderacja</label><select data-field="moderation_status" data-id="'+esc(r.id)+'"><option value="oczekuje" '+(r.moderation_status==='oczekuje'?'selected':'')+'>Oczekuje</option><option value="zatwierdzone" '+(r.moderation_status==='zatwierdzone'?'selected':'')+'>Zatwierdzone</option><option value="odrzucone" '+(r.moderation_status==='odrzucone'?'selected':'')+'>Odrzucone</option></select></div><div class="field"><label>Realizacja</label><select data-field="status" data-id="'+esc(r.id)+'"><option value="nowe" '+(r.status==='nowe'?'selected':'')+'>Nowe</option><option value="w_trakcie" '+(r.status==='w_trakcie'?'selected':'')+'>W trakcie</option><option value="zamkniete" '+(r.status==='zamkniete'?'selected':'')+'>Zamknięte</option></select></div><div class="field"><label>Priorytet</label><select data-field="priority" data-id="'+esc(r.id)+'"><option value="niski" '+(r.priority==='niski'?'selected':'')+'>Niski</option><option value="normalny" '+(r.priority==='normalny'?'selected':'')+'>Normalny</option><option value="wysoki" '+(r.priority==='wysoki'?'selected':'')+'>Wysoki</option><option value="krytyczny" '+(r.priority==='krytyczny'?'selected':'')+'>Krytyczny</option></select></div></div>'+
  '<div class="field"><label>Odpowiedź / komentarz</label><textarea data-comment="'+esc(r.id)+'">'+esc(r.comment||'')+'</textarea></div><div class="actions"><button class="btn" data-save="'+esc(r.id)+'">Zapisz zmiany</button><button class="btn danger" data-delete="'+esc(r.id)+'">Usuń</button></div></article>';
 }).join(''):'<p>Brak zgłoszeń w tym widoku.</p>';
}
async function load(){ $('reports').textContent='Ładowanie…';try{const result=await api('GET');reports=Array.isArray(result.reports)?result.reports:[];render();}catch(e){$('reports').textContent=e.message;}}
async function showSession(){const {data:{session}}=await client.auth.getSession();const user=session?.user;if(!user){$('loginCard').classList.remove('hidden');$('appCard').classList.add('hidden');return;}$('sessionInfo').textContent=user.email||'Zalogowano';$('loginCard').classList.add('hidden');$('appCard').classList.remove('hidden');await load();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;message('loginMessage','Logowanie…');try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await showSession();}catch(err){message('loginMessage',err.message||'Błąd logowania.',true);}finally{$('loginBtn').disabled=false;}});
$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();await showSession();});
$('refreshBtn').addEventListener('click',load);$('filter').addEventListener('change',render);
$('reports').addEventListener('click',async e=>{
 const save=e.target.closest('[data-save]');const del=e.target.closest('[data-delete]');
 try{
  if(save){const id=save.dataset.save;const patch={id};document.querySelectorAll('[data-id="'+CSS.escape(id)+'"]').forEach(el=>patch[el.dataset.field]=el.value);patch.comment=document.querySelector('[data-comment="'+CSS.escape(id)+'"]').value.trim();save.disabled=true;await api('PATCH',patch);await load();}
  if(del){const id=del.dataset.delete;if(!confirm('Usunąć to zgłoszenie bez możliwości odzyskania?'))return;del.disabled=true;await api('DELETE',{id});await load();}
 }catch(err){alert(err.message);}finally{if(save)save.disabled=false;}
});
showSession();
</script></body></html>
