name: Security tests

on:
  push:
    branches:
      - security/storage-cleanup-worker-2026-11
      - security/worker-hardening-followup
      - feature/visual-engine-v2-hardening
  pull_request:
    paths:
      - "supabase/functions/submit-report/**"
      - "supabase/functions/admin-manage-reports/**"
      - "supabase/functions/storage-cleanup-worker/**"
      - "supabase/functions/generate-visual/**"
      - "admin.html"
      - "supabase/migrations/**"
      - ".github/workflows/security-tests.yml"

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test security helpers
        run: deno test --allow-read --no-check supabase/functions/submit-report/auth.test.ts supabase/functions/submit-report/image_sanitize.test.ts supabase/functions/admin-manage-reports/storage-path.test.ts supabase/functions/storage-cleanup-worker/worker.test.ts supabase/functions/generate-visual/visual-engine.test.ts
