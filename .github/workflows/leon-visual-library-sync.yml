name: Leon Visual Library Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: leon-visual-library-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize explicitly published assets
        run: node scripts/sync-published-visuals.mjs
      - name: Commit central library updates
        run: |
          if git diff --quiet; then
            echo "No new published visual assets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual-library .github/visual-library-sync.json
          git commit -m "Sync approved Leon visual library assets"
          git push origin HEAD:main
