name: Leon Dropbox Importer Checks
on:
  pull_request:
    paths:
      - "supabase/functions/leon-dropbox-importer/**"
      - "tests/dropbox-importer.test.mjs"
  push:
    branches: [feature/leon-visual-bridge]
    paths:
      - "supabase/functions/leon-dropbox-importer/**"
      - "tests/dropbox-importer.test.mjs"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/dropbox-importer.test.mjs
