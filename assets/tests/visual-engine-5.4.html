<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leon Visual Engine — test 5.4</title>
<style>
body{margin:0;padding:24px;background:#07182b;color:#eef5ff;font:16px system-ui}main{max-width:900px;margin:auto}#stage{height:320px;position:relative;overflow:hidden;border:1px solid #8abce8;border-radius:16px;background:#102c4b}pre{white-space:pre-wrap;background:#10243a;padding:14px;border-radius:10px}button{padding:10px 14px}
</style>
<main><h1>Leon Visual Engine — test rdzenia 5.4</h1><p>Test walidacji receptur, deterministycznego skrótu, geometrii, zgodności wstecznej i zabezpieczeń ścieżek.</p><div id="stage"></div><pre id="results">Uruchamianie…</pre></main>
<script src="../visual-recipe-core.js"></script>
<script>
(()=>{
 const out=[];const check=(name,fn)=>{try{fn();out.push("PASS  "+name)}catch(e){out.push("FAIL  "+name+" — "+e.message)}};
 const core=window.LeonVisualRecipeCore;
 check("rdzeń załadowany",()=>{if(!core||core.version!=="1.3.0")throw Error("wrong-version")});
 check("zgodność starego formatu pojedynczego obrazu",()=>core.validateRecipe({asset:"menu/demo.webp"}));
 check("warstwy obrazu + gradientu + koloru",()=>{const r=core.validateRecipe({layers:[{type:"image",asset:"menu/demo.webp"},{type:"gradient",value:"linear-gradient(90deg,#000,#fff)"},{type:"solid",value:"#123456",geometry:{x:10,y:10,width:20,height:20}}]});if(r.layers.length!==3)throw Error("layer-count")});
 check("geometria ograniczona do 0–100%",()=>{const r=core.validateRecipe({layers:[{type:"solid",value:"#123456",geometry:{x:-5,y:120,width:150,height:40}}]});const g=r.layers[0].geometry;if(g.x!==0||g.y!==100||g.width!==100)throw Error("geometry-clamp")});
 check("powtarzalny skrót receptury",()=>{const a={id:"same",layers:[{type:"solid",value:"#123456"}]},b={layers:[{value:"#123456",type:"solid"}],id:"same"};if(core.fingerprint(core.validateRecipe(a))!==core.fingerprint(core.validateRecipe(b)))throw Error("fingerprint-differs")});
 check("odrzucenie ścieżki wychodzącej poza katalog",()=>{let ok=false;try{core.validateRecipe({asset:"../secret.svg"})}catch(e){ok=true}if(!ok)throw Error("unsafe-path-accepted")});
 check("odrzucenie nieobsługiwanego typu warstwy",()=>{let ok=false;try{core.validateRecipe({layers:[{type:"script",value:"x"}]})}catch(e){ok=true}if(!ok)throw Error("unsupported-layer-accepted")});
 check("limit liczby warstw",()=>{let ok=false;try{core.validateRecipe({layers:Array.from({length:33},()=>({type:"solid",value:"#000"}))})}catch(e){ok=true}if(!ok)throw Error("layer-limit-not-enforced")});
 try{const recipe={id:"test-render",layers:[{type:"solid",value:"#0b2745"},{type:"gradient",value:"radial-gradient(circle at 20% 20%,#3c8bd0,transparent 55%)",opacity:.8},{type:"solid",value:"rgba(1,8,18,0.4)",geometry:{x:0,y:60,width:100,height:40}}]};core.renderRecipe(document.getElementById("stage"),recipe);out.push("PASS  render lokalnej kompozycji");}catch(e){out.push("FAIL  render lokalnej kompozycji — "+e.message)}
 document.getElementById("results").textContent=out.join("\n")+"\n\nWynik: "+out.filter(x=>x.startsWith("PASS")).length+" PASS / "+out.filter(x=>x.startsWith("FAIL")).length+" FAIL";
})();
</script>
